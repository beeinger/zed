# Peekado macOS tester build
#
# Not generated by cargo xtask. Official bundling workflows stay untouched.
name: Peekado macOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/peekado-macos.yml"
      - "overlay/**"
      - "crates/paths/**"
      - "crates/release_channel/**"
      - "crates/zed/Cargo.toml"
      - "script/bundle-mac"

permissions:
  contents: read

jobs:
  bundle_macos_aarch64:
    runs-on: macos-15
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
      ZED_RELEASE_CHANNEL: dev
      ALLOW_MISSING_LICENSES: "1"
      ZED_BUNDLE: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Show disk
        run: df -h
      - name: Install cmake
        run: brew install cmake
      - name: Rust toolchain
        run: rustup show
      - name: Bundle Peekado
        run: chmod +x overlay/scripts/bundle-macos.sh && overlay/scripts/bundle-macos.sh aarch64-apple-darwin
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Peekado-macos-aarch64
          path: |
            target/aarch64-apple-darwin/release/Peekado-aarch64.dmg
            target/Peekado-macos-aarch64.zip
            target/peekado-remote-server-macos-aarch64.gz
          if-no-files-found: error
      - name: Disk after build
        if: always()
        run: df -h
